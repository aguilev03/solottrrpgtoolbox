{% extends "base.html" %}

{% block title %}Login — Solo TTRPG Tools{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">&#128274; AUTHENTICATION</h2>
            <p class="auth-subtitle">Sign in to access your solo tabletop suite.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <input type="hidden" name="next" value="{{ next or '' }}">

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    required
                    autofocus
                    autocomplete="username"
                    placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    required
                    autocomplete="current-password"
                    placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block auth-btn">
                Enter Suite &rarr;
            </button>
        </form>
    </div>
</div>
{% endblock %}
