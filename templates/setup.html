{% extends "base.html" %}

{% block title %}Initial Setup — Solo TTRPG Tools{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">&#128737; INITIAL SETUP</h2>
            <p class="auth-subtitle">Create your administrator account to secure your installation.</p>
        </div>

        <form method="POST" action="{{ url_for('setup') }}" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">Administrator Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    required
                    autofocus
                    autocomplete="username"
                    placeholder="e.g. admin">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    required
                    minlength="4"
                    autocomplete="new-password"
                    placeholder="At least 4 characters">
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    required
                    minlength="4"
                    autocomplete="new-password"
                    placeholder="Re-type your password">
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block auth-btn">
                Create Admin Account &rarr;
            </button>
        </form>
    </div>
</div>
{% endblock %}
