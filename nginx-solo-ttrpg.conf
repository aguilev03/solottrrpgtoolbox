# Solo TTRPG Tools & Hexroll 3 (Xpra) Reverse Proxy Configuration for Debian LXC
# Place this file in /etc/nginx/sites-available/solo-rpg and symlink to /etc/nginx/sites-enabled/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 8080;
    server_name _; # Responds to any domain or IP (or set your domain, e.g. rpg.aguile.net)

    # 1. Solo TTRPG Tools (Gunicorn / Flask on internal port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Xpra HTML5 Web Client & WebSockets for Hexroll 3
    # Requests from your tablet/phone to /xpra/ are routed internally to 127.0.0.1:14501 on the LXC
    location /xpra/ {
        proxy_pass http://127.0.0.1:14501/;
        proxy_http_version 1.1;

        # WebSocket headers (essential for Xpra)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # Streaming performance optimizations
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
