# Solo TTRPG Tools & Hexroll 3 (Xpra) Reverse Proxy Configuration
# Production configuration for hexworld.aguile.net on Debian LXC
# Place this file in /etc/nginx/sites-available/solo-rpg and symlink to /etc/nginx/sites-enabled/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 8080;
    server_name hexworld.aguile.net _;

    client_max_body_size 25M;

    # Gzip compression for fast mobile loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 1. Solo TTRPG Tools (Gunicorn / Flask on internal port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Xpra HTML5 Web Client & WebSockets for Hexroll 3
    # Protected by authentication session check
    location /xpra/ {
        auth_request /auth/check;

        proxy_pass http://127.0.0.1:14501/;
        proxy_http_version 1.1;

        # WebSocket headers (essential for Xpra)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # Streaming performance optimizations
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Internal subrequest for Nginx auth_request (verifies session cookie)
    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:5000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # Redirect unauthenticated direct Xpra requests to /login
    error_page 401 = @error401;
    location @error401 {
        return 302 /login;
    }
}
